<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Toplam — Günlük Kakuro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="temel.css">
<style>
:root{--bs:min(420px, calc(100vw - 32px), calc(100dvh - 380px))}
.sizes{display:flex;gap:6px}
.grid{width:var(--bs);height:var(--bs);display:grid;gap:2px;background:#d9d9d4;border:2px solid #3a3f47;border-radius:8px;overflow:hidden;user-select:none;-webkit-user-select:none}
.k{position:relative;background:#3a3f47;color:#fff;font-weight:700}
.k.clue{background:linear-gradient(to top right,#3a3f47 calc(50% - .6px),#6b7079 50%,#3a3f47 calc(50% + .6px))}
.k .a,.k .d{position:absolute;font-size:calc(var(--bs) / var(--n) * .27);line-height:1}
.k .a{right:4px;top:3px}
.k .d{left:4px;bottom:3px}
.k .bad{color:#ffb4a3}
.k .ok{color:#b9e3c5}
.c{position:relative;background:#fff;display:grid;place-items:center;cursor:pointer;font-weight:600;color:#3c6aa3;font-size:calc(var(--bs) / var(--n) * .5);transition:background-color .15s}
.c.peer{background:#f3f6fa}
.c.sel{background:#cfe0f5}
.c.bad{color:var(--bad)}
.c.in{animation:pop .25s var(--ease)}
.c .notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);font-size:calc(var(--bs) / var(--n) * .19);color:var(--muted);line-height:1}
.c .notes i{font-style:normal;display:grid;place-items:center}
.grid.won .c{animation:bounce .7s var(--ease) both;animation-delay:calc(var(--d) * 35ms)}
.pad{width:var(--bs);display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.pad button{height:48px;border:0;border-radius:10px;background:var(--key);font-size:20px;font-weight:600;cursor:pointer;transition:background-color .2s,transform .12s}
.pad button:active{transform:scale(.93)}
.pad button.no{opacity:.3}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tools .btn{padding:10px 16px;font-size:14px}
.btn.ghost.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.demo{display:grid;grid-template-columns:repeat(3,48px);gap:2px;background:#d9d9d4;width:max-content;border:2px solid #3a3f47;margin:10px 0}
.demo i{width:48px;height:48px;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:19px;color:#3c6aa3;background:#fff;position:relative}
.demo i.k{background:#3a3f47;color:#fff;font-size:12px}
</style>
</head>
<body>
<div class="app">
  <main>
    <div class="sub" id="sub"></div>
    <div class="sizes" id="sizes"><button class="chip" data-n="6">Kolay</button><button class="chip" data-n="7">Zor</button></div>
    <div class="status"><span class="clockbig" id="clock">0:00</span></div>
    <div class="grid" id="grid"></div>
    <div class="pad" id="pad"></div>
    <div class="tools">
      <button class="btn ghost" id="undoBtn">Geri al</button>
      <button class="btn ghost" id="eraseBtn">Sil</button>
      <button class="btn ghost" id="noteBtn">Not</button>
      <button class="btn ghost" id="hintBtn">İpucu</button>
    </div>
  </main>
</div>

    <ul><li>Siyah karedeki sağ üst sayı, sağındaki beyaz karelerin; sol alt sayı, altındaki beyaz karelerin <b>toplamıdır</b>.</li>
    <li>Bir toplamın içinde aynı rakam <b>iki kez</b> kullanılamaz.</li></ul>
    <div class="demo"><i class="k"></i><i class="k">↓4</i><i class="k">↓3</i><i class="k">6→</i><i>4</i><i>2</i><i class="k">2→</i><i>…</i><i>…</i></div>
    <p class="note">Örnek: 6'yı iki farklı rakamla yazmanın yolları 1+5 ve 2+4'tür.</p>
    <div class="hr"></div><p class="note">Her bulmacanın tek bir çözümü vardır. Doğru tamamlanan toplamlar yeşile, yanlışlar kırmızıya döner.</p>`
});

let stats = store.get("toplam-stats", { 6: { played: 0, best: null }, 7: { played: 0, best: null }, streak: 0, best: 0, lastDay: null });
let size = store.get("toplam-size", 6);
let mode, day, pid, P, W, H, sol, runs, runOf, vals, notes, sel, noteMode = false, history, elapsed, startedAt, hints, won;
const bySize = n => PUZZLES.map((p, i) => p.w === n ? i : -1).filter(i => i >= 0);
const LEVEL = { 6: "Kolay", 7: "Zor" };

/* ---------- Sıralar ---------- */
function prepare() {
  W = P.w; H = P.h; sol = [...P.s].map(Number);
  runs = P.r.map(([start, h, len, sum]) => ({ cells: Array.from({ length: len }, (_, k) => start + (h ? k : k * W)), h: !!h, sum, clue: h ? start - 1 : start - W }));
  runOf = {};
  runs.forEach((r, k) => r.cells.forEach(i => (runOf[i] ||= []).push(k)));
}
function runState(r) {
  const v = r.cells.map(i => vals[i]);
  const dup = v.some((x, k) => x && v.indexOf(x) !== k);
  if (dup) return "bad";
  if (v.some(x => !x)) return "";
  return v.reduce((a, b) => a + b) === r.sum ? "ok" : "bad";
}

/* ---------- Render ---------- */
const grid = $("#grid");
function build() {
  grid.style.gridTemplateColumns = `repeat(${W},1fr)`;
  grid.style.gridTemplateRows = `repeat(${H},1fr)`;
  grid.style.setProperty("--n", W);
  grid.classList.remove("won");
  const clues = {};
  runs.forEach((r, k) => { (clues[r.clue] ||= {})[r.h ? "a" : "d"] = k; });
  grid.innerHTML = sol.map((v, i) => {
    if (v) return `<div class="c" data-i="${i}" style="--d:${Math.floor(i / W) + i % W}"></div>`;
    const c = clues[i];
    if (!c) return `<div class="k"></div>`;
    return `<div class="k clue">${c.a !== undefined ? `<span class="a" data-k="${c.a}">${runs[c.a].sum}</span>` : ""}${c.d !== undefined ? `<span class="d" data-k="${c.d}">${runs[c.d].sum}</span>` : ""}</div>`;
  }).join("");
  $("#pad").innerHTML = Array.from({ length: 9 }, (_, k) => `<button data-v="${k + 1}">${k + 1}</button>`).join("");
}
function render(changed = -1) {
  const states = runs.map(runState);
  const peers = sel >= 0 ? new Set(runOf[sel].flatMap(k => runs[k].cells)) : new Set();
  grid.querySelectorAll(".c").forEach(el => {
    const i = +el.dataset.i;
    el.classList.toggle("sel", i === sel);
    el.classList.toggle("peer", i !== sel && peers.has(i));
    el.classList.toggle("bad", runOf[i].some(k => { const v = runs[k].cells.map(j => vals[j]); return vals[i] && v.filter(x => x === vals[i]).length > 1; }));
    el.classList.toggle("in", i === changed);
    if (vals[i]) el.textContent = vals[i];
    else if (notes[i] && notes[i].length) el.innerHTML = `<div class="notes">${Array.from({ length: 9 }, (_, k) => `<i>${notes[i].includes(k + 1) ? k + 1 : ""}</i>`).join("")}</div>`;
    else el.textContent = "";
  });
  grid.querySelectorAll(".k span").forEach(s => { const st = states[+s.dataset.k]; s.classList.toggle("ok", st === "ok"); s.classList.toggle("bad", st === "bad"); });
  // seçili karenin sıralarında kullanılmış rakamları soluk göster
  const used = sel >= 0 ? new Set(runOf[sel].flatMap(k => runs[k].cells.filter(j => j !== sel).map(j => vals[j])).filter(Boolean)) : new Set();
  $("#pad").querySelectorAll("button").forEach(b => b.classList.toggle("no", used.has(+b.dataset.v)));
  $("#noteBtn").classList.toggle("on", noteMode);
  $("#undoBtn").disabled = !history.length || won;
  ["#eraseBtn", "#noteBtn", "#hintBtn"].forEach(s => $(s).disabled = won);
  document.querySelectorAll("#sizes .chip").forEach(b => b.classList.toggle("on", +b.dataset.n === W));
}

/* ---------- Etkileşim ---------- */
const snap = () => history.push({ vals: vals.slice(), notes: notes.map(n => n.slice()) });
grid.addEventListener("click", e => { const el = e.target.closest(".c"); if (!el || won) return; sel = +el.dataset.i; tickStart(); render(); });
$("#pad").addEventListener("click", e => { const b = e.target.closest("button"); if (b) put(+b.dataset.v); });
function put(v) {
  if (won || sel < 0) return;
  tickStart(); snap();
  if (noteMode) { const n = notes[sel], k = n.indexOf(v); if (k >= 0) n.splice(k, 1); else n.push(v); vals[sel] = 0; }
  else { vals[sel] = vals[sel] === v ? 0 : v; notes[sel] = []; }
  save(); render(sel); check();
}
$("#eraseBtn").onclick = () => { if (sel < 0 || won) return; snap(); vals[sel] = 0; notes[sel] = []; save(); render(); };
$("#noteBtn").onclick = () => { noteMode = !noteMode; render(); };
$("#undoBtn").onclick = () => { const h = history.pop(); if (!h || won) return; vals = h.vals; notes = h.notes; save(); render(); };
$("#hintBtn").onclick = () => {
  if (won) return;
  tickStart();
  const white = sol.map((v, i) => v ? i : -1).filter(i => i >= 0);
  const i = sel >= 0 && vals[sel] !== sol[sel] ? sel : white.find(k => vals[k] !== sol[k]);
  if (i === undefined) return;
  snap(); vals[i] = sol[i]; notes[i] = []; sel = i; hints++; elapsed += 15;
  toast("İpucu: +15 saniye");
  save(); render(i); check();
};
document.addEventListener("keydown", e => {
  if (T.isOpen() || won) return;
  if (e.key >= "1" && e.key <= "9") put(+e.key);
  else if (e.key === "Backspace" || e.key === "Delete" || e.key === "0") $("#eraseBtn").click();
  else if (e.key === "n" || e.key === "N") $("#noteBtn").click();
  else if (e.key.startsWith("Arrow") && sel >= 0) {
    const [dr, dc] = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    let r = Math.floor(sel / W), c = sel % W;
    for (let k = 0; k < W * H; k++) { r += dr; c += dc; if (r < 0 || r >= H || c < 0 || c >= W) break; if (sol[r * W + c]) { sel = r * W + c; break; } }
    e.preventDefault(); render();
  }
});
document.querySelectorAll("#sizes .chip").forEach(b => b.onclick = () => { if (+b.dataset.n !== W) start(mode, +b.dataset.n); });

/* ---------- Süre ---------- */
const now = () => elapsed + (startedAt ? (Date.now() - startedAt) / 1000 : 0);
function tickStart() { if (!won && !startedAt) startedAt = Date.now(); }
function tickStop() { if (startedAt) { elapsed += (Date.now() - startedAt) / 1000; startedAt = null; } }
setInterval(() => { $("#clock").textContent = T.fmt(now()); }, 250);
document.addEventListener("visibilitychange", () => { if (document.hidden) { tickStop(); save(); } });

/* ---------- Oyun ---------- */
function check() {
  if (runs.some(r => runState(r) !== "ok")) return;
  tickStop(); won = true; sel = -1;
  save(); render(); grid.classList.add("won");
  if (mode === "daily") {
    const st = stats[W]; st.played++;
    st.best = st.best === null ? Math.round(elapsed) : Math.min(st.best, Math.round(elapsed));
    T.seriGuncelle(stats, day, true);
    store.set("toplam-stats", stats);
  }
  toast(`Çözdünüz! ${T.fmt(elapsed)}`, 1900);
  setTimeout(() => { if (!T.isOpen()) T.open("stats"); }, 1400);
}
function key() { return `toplam-${mode === "daily" ? "daily" : "practice"}-${size}`; }
function start(m, n = size, fresh = false) {
  tickStop();
  mode = m; size = n; store.set("toplam-size", n);
  day = T.dayIndex();
  const list = bySize(n);
  let s = fresh && m === "practice" ? null : store.get(key(), null);
  if (s && m === "daily" && s.day !== day) s = null;
  if (!s) {
    const p = m === "daily" ? list[((day * 7 + 5) % list.length + list.length) % list.length] : T.shuffle(list.filter(i => i !== pid))[0];
    s = { pid: p, vals: null, notes: null, elapsed: 0, hints: 0, won: false };
  }
  pid = s.pid; P = PUZZLES[pid]; prepare();
  vals = s.vals || Array(W * H).fill(0);
  notes = s.notes || Array.from({ length: W * H }, () => []);
  ({ elapsed, hints, won } = s);
  sel = -1; history = []; startedAt = null; noteMode = false;
  save(); build(); render();
  if (won) grid.classList.add("won");
  T.altSatir(m, day, ["Yeni bulmaca", () => start("practice", size, true)], LEVEL[n]);
  T.aktifMod(m);
}
function save() { store.set(key(), { day, pid, vals, notes, elapsed: now(), hints, won }); }

/* ---------- İstatistik ---------- */
T.istatistik(() => `${won ? `<div class="result"><div class="big">${T.fmt(elapsed)}</div><p>${LEVEL[W]} kakuroyu çözdünüz${hints ? ` · ${hints} ipucu` : ""}</p></div><h3>Genel</h3>` : ""}
  ${T.sayilar([[stats[6].played + stats[7].played, "Çözülen"], [stats[6].best === null ? "–" : T.fmt(stats[6].best), "En İyi Kolay"], [stats[7].best === null ? "–" : T.fmt(stats[7].best), "En İyi Zor"], [T.seri(stats), "Seri"]])}
  ${T.altBolum({ gunluk: mode === "daily", bitti: won })}`);
T.paylasim(() => `Toplam #${day + 1} · ${LEVEL[W]} · ${T.fmt(elapsed)}${hints ? ` (${hints} ipucu)` : " · ipuçsuz"} ➕`);
T.gunDegisince(() => { if (mode === "daily" && T.dayIndex() !== day) start("daily"); });

/* ---------- Boot ---------- */
start("daily", size);
T.ilkZiyaret("toplam-seen");
</script>
</body>
</html>
