const MAX = 6;
const COLORS = ["#c26a3d", "#6aa780", "#d8b257", "#e59a5a", "#8a7d60", "#3a3f47", "#7ea6d6", "#5b8fcf", "#a5523f", "#9b8b5e", "#c98bc5", "#b46a8f", "#a3a39b", "#e2b935", "#6b7079", "#2f5f97", "#4f78a8", "#d9654b", "#4b8a61", "#9a6fc8"];
const { $, store, toast } = T;
T.kur({
  ad: "İhracat",
  modDegisti: m => start(m, true),
  yeni: () => start("practice", true), yeniEtiket: "Yeni ülke",
  yardim: `<p>Bir ülkenin <b>ihracatını</b> gösteren grafikten ülkeyi 6 denemede bulun.</p>
    <ul><li>Kutuların büyüklüğü, o ürün grubunun ihracattaki payını gösterir.</li>
    <li>Her tahminden sonra gizli ülkeye olan mesafeyi ve yönü görürsünüz.</li></ul>
    <div class="hr"></div><p class="note">Veri: BM Comtrade, mal ihracatı (HS fasılları ürün gruplarına toplandı). Gösterilen yıl, ülkenin verisi bulunan en yakın yıldır.</p>`
});

let stats = store.get("ihracat-stats", { played: 0, wins: 0, streak: 0, best: 0, lastDay: null, dist: [0, 0, 0, 0, 0, 0] });
let mode, day, target, guesses, over, won;
const POOL = Object.keys(TRADE.c).filter(k => G.byK.has(k)).sort();

/* ---------- Ağaç haritası (squarified) ---------- */
function squarify(items, x, y, w, h) {
  const out = [];
  let rest = items.slice();
  while (rest.length) {
    const total = rest.reduce((s, i) => s + i.v, 0);
    const horiz = w >= h, side = horiz ? h : w;
    let row = [], best = Infinity;
    for (const it of rest) {
      const r = [...row, it], s = r.reduce((a, b) => a + b.v, 0);
      const len = s / total * (horiz ? w : h);
      const worst = Math.max(...r.map(q => { const l = q.v / s * side; return Math.max(len / l, l / len); }));
      if (worst > best) break;
      best = worst; row = r;
    }
    const s = row.reduce((a, b) => a + b.v, 0), len = s / total * (horiz ? w : h);
    let off = 0;
    for (const it of row) {
      const l = it.v / s * side;
      out.push({ ...it, x: horiz ? x : x + off, y: horiz ? y + off : y, w: horiz ? len : l, h: horiz ? l : len });
      off += l;
    }
    if (horiz) { x += len; w -= len; } else { y += len; h -= len; }
    rest = rest.slice(row.length);
  }
  return out;
}
function drawTree() {
  const d = TRADE.c[target];
  const box = $("#tm"), W = box.clientWidth, H = box.clientHeight;
  const items = d.p.map(([g, v]) => ({ g, v }));
  const other = Math.max(0, Math.round((100 - items.reduce((s, i) => s + i.v, 0)) * 10) / 10);
  if (other >= 1) items.push({ g: -1, v: other });
  const rects = squarify(items, 0, 0, W, H);
  box.innerHTML = rects.map((r, i) => {
    const name = r.g < 0 ? "Diğer" : TRADE.g[r.g], small = r.w < 70 || r.h < 40;
    return `<div class="${small ? "s" : ""}" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:${r.g < 0 ? "#bdbdb8" : COLORS[r.g]};--d:${i}" title="${name} %${r.v}"><b>%${String(r.v).replace(".", ",")}</b>${name}</div>`;
  }).join("");
  const bn = d.t >= 1000 ? `${(d.t / 1000).toLocaleString("tr-TR", { maximumFractionDigits: 1 })} milyar $` : `${d.t.toLocaleString("tr-TR")} milyon $`;
  $("#meta").innerHTML = `Toplam mal ihracatı <b>${bn}</b> · ${d.y}`;
}

/* ---------- Render ---------- */
function render(fresh = -1) {
  const t = G.byK.get(target);
  $("#guesses").innerHTML = Array.from({ length: MAX }, (_, i) => {
    const k = guesses[i];
    if (!k) return `<div class="g empty"><div></div><div></div><div></div><div></div></div>`;
    const c = G.byK.get(k), d = G.km(c, t), hit = k === target;
    return `<div class="g${hit ? " win" : ""}${i === fresh ? " new" : ""}">
      <div style="--d:0"><img src="bayraklar/${k}.svg" alt="">${c.a}</div>
      <div style="--d:1">${hit ? "🎉" : G.kmYaz(d)}</div>
      <div class="arrow" style="--d:2">${hit ? "✅" : G.yon(c, t).ok}</div>
      <div style="--d:3">%${G.yakinlik(d)}</div></div>`;
  }).join("");
  const a = $("#answer");
  a.hidden = !over;
  if (over) { a.className = "answer" + (won ? " win" : ""); a.innerHTML = `<img src="bayraklar/${target}.svg" alt=""><div><small>${won ? `${guesses.length}. tahminde buldunuz` : "Cevap"}</small><b>${t.a}</b></div>`; }
  $("#gbox").hidden = over;
}

/* ---------- Oyun ---------- */
G.kutu($("#field"), $("#opts"), c => guess(c.k), () => new Set(guesses));
function guess(k) {
  if (over) return;
  if (guesses.includes(k)) return toast("Bunu zaten denediniz");
  guesses.push(k);
  if (k === target) { over = true; won = true; }
  else if (guesses.length >= MAX) { over = true; won = false; }
  else { const c = G.byK.get(k), t = G.byK.get(target); toast(`${G.kmYaz(G.km(c, t))} · ${G.yon(c, t).ad}`); }
  save(); render(guesses.length - 1);
  if (over) finish();
}
function finish() {
  if (mode === "daily") {
    stats.played++;
    if (won) { stats.wins++; stats.dist[guesses.length - 1]++; }
    T.seriGuncelle(stats, day, won);
    store.set("ihracat-stats", stats);
  }
  toast(won ? ["Dahi!", "Muhteşem!", "Harika!", "Çok iyi!", "Güzel!", "Kıl payı!"][guesses.length - 1] : `Cevap: ${G.byK.get(target).a}`, 2000);
  setTimeout(() => { if (!T.isOpen()) T.open("stats"); }, 1500);
}
function start(m, fresh = false) {
  mode = m; day = T.dayIndex();
  let s = fresh && m === "practice" ? null : store.get(`ihracat-${m}`, null);
  if (s && m === "daily" && s.day !== day) s = null;
  if (s && !TRADE.c[s.target]) s = null;
  if (!s) s = { target: m === "daily" ? POOL[((day * 29 + 3) % POOL.length + POOL.length) % POOL.length] : T.shuffle(POOL.slice())[0], guesses: [] };
  ({ target, guesses } = s);
  won = guesses.includes(target); over = won || guesses.length >= MAX;
  save(); drawTree(); render();
  T.altSatir(m, day, ["Yeni ülke", () => start("practice", true)]);
  T.aktifMod(m);
}
function save() { store.set(`ihracat-${mode}`, { day, target, guesses }); }
addEventListener("resize", () => target && drawTree());

/* ---------- İstatistik ---------- */
T.istatistik(() => `${over ? `<div class="answer${won ? " win" : ""}"><img src="bayraklar/${target}.svg" alt=""><div><small>${won ? `${guesses.length}/${MAX}` : "Cevap"}</small><b>${G.byK.get(target).a}</b></div></div><h3>Genel</h3>` : ""}
  ${T.sayilar([[stats.played, "Oynanan"], [stats.played ? Math.round(stats.wins / stats.played * 100) : 0, "Kazanma %"], [T.seri(stats), "Güncel Seri"], [stats.best || 0, "En İyi Seri"]])}
  <h3>Tahmin Dağılımı</h3>${T.dagilim(stats.dist, [1, 2, 3, 4, 5, 6], mode === "daily" && won ? guesses.length - 1 : -1)}
  ${T.altBolum({ gunluk: mode === "daily", bitti: over })}`);
T.paylasim(() => {
  const t = G.byK.get(target);
  const rows = guesses.map(k => k === target ? "🟩🟩🟩🟩🟩🎉" : (p => "🟩".repeat(Math.floor(p / 20)) + "⬜".repeat(5 - Math.floor(p / 20)))(G.yakinlik(G.km(G.byK.get(k), t))) + G.yon(G.byK.get(k), t).ok).join("\n");
  return `İhracat #${day + 1} ${won ? guesses.length : "X"}/${MAX}\n${rows}`;
});
T.gunDegisince(() => { if (mode === "daily" && T.dayIndex() !== day) start("daily"); });

/* ---------- Boot ---------- */
start("daily");
T.ilkZiyaret("ihracat-seen");
</script>
