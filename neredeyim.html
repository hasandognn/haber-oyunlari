<title>Neredeyim — Fotoğraftan Konum Bulma</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="temel.css">
<style>
main{gap:10px;max-width:640px;padding-top:10px}
.hud{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.hud b{color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
.rounds{display:flex;gap:5px}
.rounds i{width:26px;height:6px;border-radius:99px;background:var(--key)}
.rounds i.done{background:var(--ok)}
.rounds i.cur{background:var(--ink)}
.photo{position:relative;width:100%;aspect-ratio:16/10;max-height:36dvh;border-radius:14px;overflow:hidden;background:#222;cursor:zoom-in}
.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .4s}
.photo img.load{opacity:0}
.credit{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 6px;font-size:10.5px;color:rgba(255,255,255,.85);background:linear-gradient(transparent,rgba(0,0,0,.55));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.credit a{color:inherit}
.map{position:relative;width:100%;height:min(40dvh, 380px);min-height:220px;border-radius:14px;overflow:hidden;background:#dfeaf2;touch-action:none;cursor:crosshair}
.map canvas{width:100%;height:100%;display:block}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.92);font-size:19px;font-weight:600;cursor:pointer}
.res{width:100%;border-radius:14px;background:var(--soft);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.res b{font-size:18px}
.res small{display:block;color:var(--muted);font-size:12px}
.full{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;display:none;align-items:center;justify-content:center;cursor:zoom-out}
.full.on{display:flex}
.full img{max-width:100%;max-height:100%;object-fit:contain}
.sumrow{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.sumrow:last-child{border-bottom:0}
.sumrow span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
</style>
</head>
<body>
<div class="app">
  <main>
    <div class="sub" id="sub"></div>
    <div class="hud"><div class="rounds" id="rounds"></div><span>Puan <b id="score">0</b></span></div>
    <div class="photo" id="photo"><img id="img" alt="Bir sokaktan görüntü"><div class="credit" id="credit"></div></div>
    <div class="map" id="map"><canvas id="cv"></canvas><div class="zoom"><button id="zin" aria-label="Yakınlaştır">+</button><button id="zout" aria-label="Uzaklaştır">−</button></div></div>
    <div class="res" id="res" hidden></div>
    <div class="actions"><button class="btn" id="goBtn" disabled>Tahmin et</button></div>
  </main>
</div>
<div class="full" id="full"><img id="fullImg" alt=""></div>

{"img":"fotograflar/207.jpg","lat":-34.9012,"lon":-56.1918,"city":"Montevideo","author":"Andrés Franchi Ugart…","lic":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Calle_Cerro_Largo_esquina_Libertador_-_panoramio_(1).jpg"}];
const ROUNDS = 5, MAXP = 5000;
const { $, store, toast } = T;
T.kur({
  ad: "Neredeyim",
  modDegisti: m => start(m, true),
  yeni: () => start("practice", true), yeniEtiket: "Yeni oyun",
  yardim: `<p>Fotoğraf dünyanın neresinde çekildi? Haritada tahmininizi işaretleyin.</p>
    <ul><li>Her oyun <b>5 tur</b>dur. Gerçek konuma ne kadar yakınsanız o kadar puan alırsınız: tur başına en fazla <b>5.000</b>.</li>
    <li>Haritayı sürükleyin, + ve − ile yakınlaştırın. Fotoğrafa dokunursanız büyür.</li>
    <li>Tabelalar, araçların hangi şeritten gittiği, mimari ve bitki örtüsü iyi ipuçlarıdır.</li></ul>
    <div class="hr"></div><p class="note">Fotoğraflar Wikimedia Commons'tan, sahiplerinin seçtiği Creative Commons lisanslarıyla kullanılmıştır; yazar ve lisans her fotoğrafın altında yazar.</p>`
});

let stats = store.get("neredeyim-stats", { played: 0, total: 0, best: 0, streak: 0, lastDay: null, perfect: 0 });
let mode, day, picks, round, results, guess, revealed;

/* ---------- Harita ---------- */
const cv = $("#cv"), ctx = cv.getContext("2d");
const FEAT = G.U.map(c => {
  let f = { type: "Feature", geometry: { type: "MultiPolygon", coordinates: c.g.map(r => [r]) } };
  if (d3.geoArea(f) > 2 * Math.PI) f.geometry.coordinates = c.g.map(r => [r.slice().reverse()]);
  return f;
});
const proj = d3.geoNaturalEarth1(), path = d3.geoPath(proj, ctx);
let W = 0, H = 0, k = 1, tx = 0, ty = 0, base = null;
function resize() {
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  proj.fitExtent([[8, 8], [W - 8, H - 8]], { type: "Sphere" });
  base = { s: proj.scale(), t: proj.translate() };
  apply(); draw();
}
function apply() { proj.scale(base.s * k).translate([base.t[0] * k + tx, base.t[1] * k + ty]); }
// harita kenarları görünür alanın dışına fazla taşmasın (sol kenar ≈ tx, sağ kenar ≈ tx + W·k)
function clampPan() {
  const m = 40;
  tx = Math.max(W - W * k - m, Math.min(m, tx));
  ty = Math.max(H - H * k - m, Math.min(m, ty));
}
// imlecin altındaki nokta yerinde kalacak şekilde yakınlaştır
function zoomAt(f, cx = W / 2, cy = H / 2) {
  const p = proj.invert([cx, cy]);
  k = Math.max(1, Math.min(40, k * f));
  apply();
  const q = proj(p);
  tx += cx - q[0]; ty += cy - q[1];
  clampPan(); apply(); draw();
}
function pin(x, y, color) {
  ctx.beginPath(); ctx.arc(x, y, 7, 0, 2 * Math.PI); ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = "#fff"; ctx.stroke();
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.beginPath(); path({ type: "Sphere" }); ctx.fillStyle = "#dfeaf2"; ctx.fill();
  ctx.beginPath(); path(d3.geoGraticule10()); ctx.strokeStyle = "rgba(47,74,99,.07)"; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); FEAT.forEach(f => path(f)); ctx.fillStyle = "#f6f3ea"; ctx.fill();
  ctx.strokeStyle = "rgba(120,110,90,.45)"; ctx.lineWidth = .6; ctx.stroke();
  const P = PHOTOS[picks[round]];
  if (revealed) {
    const a = proj([guess[1], guess[0]]), b = proj([P.lon, P.lat]);
    ctx.beginPath(); path({ type: "LineString", coordinates: [[guess[1], guess[0]], [P.lon, P.lat]] });
    ctx.setLineDash([5, 5]); ctx.strokeStyle = "#3a3f47"; ctx.lineWidth = 1.6; ctx.stroke(); ctx.setLineDash([]);
    pin(b[0], b[1], "#6aa780");
    pin(a[0], a[1], "#d9654b");
  } else if (guess) {
    const a = proj([guess[1], guess[0]]); pin(a[0], a[1], "#d9654b");
  }
}
let drag = null;
cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, tx, ty, moved: false }; });
cv.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 6) return;
  drag.moved = true; tx = drag.tx + dx; ty = drag.ty + dy; clampPan(); apply(); draw();
});
cv.addEventListener("pointerup", e => {
  const d = drag; drag = null;
  if (!d || d.moved || revealed || isOver()) return;
  const r = cv.getBoundingClientRect(), ll = proj.invert([e.clientX - r.left, e.clientY - r.top]);
  if (!ll || !isFinite(ll[0]) || Math.abs(ll[1]) > 90) return;
  guess = [ll[1], ll[0]];
  $("#goBtn").disabled = false;
  draw();
});
cv.addEventListener("wheel", e => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.25 : .8, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
$("#zin").onclick = () => zoomAt(1.6);
$("#zout").onclick = () => zoomAt(1 / 1.6);
addEventListener("resize", resize);

/* ---------- Tur akışı ---------- */
const isOver = () => results.length >= ROUNDS;
const points = km => Math.round(MAXP * Math.exp(-km / 2000));
function showPhoto() {
  const P = PHOTOS[picks[Math.min(round, ROUNDS - 1)]];
  const img = $("#img");
  img.classList.add("load");
  img.onload = () => img.classList.remove("load");
  img.src = P.img;
  $("#credit").innerHTML = `Fotoğraf: ${P.author || "Wikimedia Commons"} · ${P.lic} · <a href="${P.page}" target="_blank" rel="noopener">Commons</a>`;
}
function render() {
  $("#rounds").innerHTML = Array.from({ length: ROUNDS }, (_, i) => `<i class="${i < results.length ? "done" : i === round ? "cur" : ""}"></i>`).join("");
  $("#score").textContent = results.reduce((s, r) => s + r.p, 0).toLocaleString("tr-TR");
  const res = $("#res"), go = $("#goBtn");
  if (revealed) {
    const r = results[results.length - 1], P = PHOTOS[picks[round]];
    res.hidden = false;
    res.innerHTML = `<div><small>${r.km.toLocaleString("tr-TR")} km uzaktaydınız</small><b>${P.city}</b></div><div style="text-align:right"><small>Bu tur</small><b>+${r.p.toLocaleString("tr-TR")}</b></div>`;
    go.disabled = false; go.textContent = isOver() ? "Sonuçları gör" : "Sonraki tur";
  } else {
    res.hidden = true;
    go.textContent = "Tahmin et"; go.disabled = !guess;
  }
  draw();
}
$("#goBtn").onclick = () => {
  if (revealed) {
    if (isOver()) return T.open("stats");
    round++; guess = null; revealed = false; k = 1; tx = ty = 0; apply();
    save(); showPhoto(); render();
    return;
  }
  if (!guess) return;
  const P = PHOTOS[picks[round]];
  const km = G.km({ y: guess[0], x: guess[1] }, { y: P.lat, x: P.lon });
  results.push({ km, p: points(km), g: guess });
  revealed = true;
  // haritayı iki noktayı gösterecek şekilde ortala
  k = 1; tx = ty = 0; apply();
  save(); render();
  toast(km < 50 ? "Tam isabet!" : km < 500 ? "Çok yakın!" : km < 2000 ? "Fena değil" : "Uzaktaydınız");
  if (isOver()) finish();
};
$("#photo").onclick = () => { $("#fullImg").src = $("#img").src; $("#full").classList.add("on"); };
$("#full").onclick = () => $("#full").classList.remove("on");
function finish() {
  const total = results.reduce((s, r) => s + r.p, 0);
  if (mode === "daily") {
    stats.played++; stats.total += total; stats.best = Math.max(stats.best, total);
    if (results.every(r => r.km < 500)) stats.perfect++;
    T.seriGuncelle(stats, day, true);
    store.set("neredeyim-stats", stats);
  }
  setTimeout(() => { if (!T.isOpen()) T.open("stats"); }, 1800);
}
function start(m, fresh = false) {
  mode = m; day = T.dayIndex();
  let s = fresh && m === "practice" ? null : store.get(`neredeyim-${m}`, null);
  if (s && m === "daily" && s.day !== day) s = null;
  if (s && s.picks.some(i => !PHOTOS[i])) s = null;
  if (!s) {
    const rand = m === "daily" ? T.rng(day * 4099 + 13) : Math.random;
    // farklı şehirlerden 5 fotoğraf
    const order = T.shuffle(PHOTOS.map((_, i) => i), rand), seen = new Set(), picks = [];
    for (const i of order) { if (seen.has(PHOTOS[i].city)) continue; seen.add(PHOTOS[i].city); picks.push(i); if (picks.length === ROUNDS) break; }
    s = { picks, round: 0, results: [], guess: null, revealed: false };
  }
  ({ picks, round, results, guess, revealed } = s);
  save(); showPhoto(); render();
  T.altSatir(m, day, ["Yeni oyun", () => start("practice", true)]);
  T.aktifMod(m);
}
function save() { store.set(`neredeyim-${mode}`, { day, picks, round, results, guess, revealed }); }

/* ---------- İstatistik ---------- */
T.istatistik(() => {
  const total = results.reduce((s, r) => s + r.p, 0);
  return `${isOver() ? `<div class="result"><div class="big">${total.toLocaleString("tr-TR")}</div><p>/ ${(ROUNDS * MAXP).toLocaleString("tr-TR")} puan</p></div>
    <div style="margin-top:12px">${results.map((r, i) => `<div class="sumrow"><span>${i + 1}. ${PHOTOS[picks[i]].city} · ${r.km.toLocaleString("tr-TR")} km</span><span>+${r.p.toLocaleString("tr-TR")}</span></div>`).join("")}</div><h3>Genel</h3>` : ""}
    ${T.sayilar([[stats.played, "Oynanan"], [stats.best.toLocaleString("tr-TR"), "En Yüksek"], [stats.played ? Math.round(stats.total / stats.played).toLocaleString("tr-TR") : "–", "Ortalama"], [T.seri(stats), "Seri"]])}
    ${T.altBolum({ gunluk: mode === "daily", bitti: isOver() })}`;
});
T.paylasim(() => {
  const total = results.reduce((s, r) => s + r.p, 0);
  return `Neredeyim #${day + 1}: ${total.toLocaleString("tr-TR")} / 25.000 🌍\n${results.map(r => r.p >= 4500 ? "🟩" : r.p >= 2500 ? "🟨" : r.p >= 1000 ? "🟧" : "🟥").join("")}`;
});
T.gunDegisince(() => { if (mode === "daily" && T.dayIndex() !== day) start("daily"); });

/* ---------- Boot ---------- */
start("daily");
resize();
T.ilkZiyaret("neredeyim-seen");
</script>
