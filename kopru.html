<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Köprü — Günlük Ada Bulmacası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="temel.css">
<style>
:root{--bs:min(460px, calc(100vw - 24px), calc(100dvh - 300px))}
.sizes{display:flex;gap:6px}
.board{width:var(--bs);height:var(--bs);border-radius:16px;background:#eef4f8;touch-action:none;user-select:none;-webkit-user-select:none}
.board svg{width:100%;height:100%;display:block}
.dotgrid circle{fill:#d5e0e8}
.br line{stroke:#2f4a63;stroke-width:.9;stroke-linecap:round}
.br line.hint{stroke:var(--ok)}
.ghost{stroke:#7ea6d6;stroke-width:.8;stroke-dasharray:1.2 1.2;stroke-linecap:round}
.is circle{fill:#fff;stroke:#2f4a63;stroke-width:.7;transition:fill .25s,stroke .25s}
.is text{font-size:4.2px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:#2f4a63;pointer-events:none}
.is .full circle{fill:#d9eedf;stroke:var(--ok)}
.is .full text{fill:#3f7a54}
.is .over circle{fill:#f8e1db;stroke:var(--bad)}
.is .over text{fill:var(--bad)}
.is .sel circle{stroke-width:1.2;fill:#dbe8f6}
.is g{cursor:pointer}
.board.won .is circle{animation:pop .6s var(--ease) both;animation-delay:calc(var(--d) * 40ms);transform-box:fill-box;transform-origin:center}
.legend{display:flex;flex-direction:column;gap:8px;font-size:14px}
.legend span{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2px solid #2f4a63;font-weight:700;font-size:13px;margin-right:8px}
</style>
</head>
<body>
<div class="app">
  <main>
    <div class="sub" id="sub"></div>
    <div class="sizes" id="sizes"><button class="chip" data-n="7">Kolay</button><button class="chip" data-n="8">Orta</button><button class="chip" data-n="9">Zor</button></div>
    <div class="status"><span class="clockbig" id="clock">0:00</span><span id="left"></span></div>
    <div class="board" id="board"></div>
    <div class="actions">
      <button class="btn ghost" id="undoBtn">Geri al</button>
      <button class="btn ghost" id="hintBtn">İpucu</button>
      <button class="btn ghost" id="clearBtn">Temizle</button>
    </div>
  </main>
</div>

<script src="temel.js"></script>

let mode, day, pid, P, isl, E, X, val, sel = -1, history, elapsed, startedAt, hints, won;
const bySize = n => PUZZLES.map((p, i) => p.w === n ? i : -1).filter(i => i >= 0);

/* ---------- Kenarlar ---------- */
function buildEdges() {
  const at = new Map(isl.map(([r, c], i) => [r + "," + c, i]));
  E = [];
  isl.forEach(([r, c], i) => {
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      for (let rr = r + dr, cc = c + dc; rr < P.h && cc < P.w; rr += dr, cc += dc) {
        const j = at.get(rr + "," + cc);
        if (j !== undefined) { E.push([i, j, dr === 0]); break; }
      }
    }
  });
  const crosses = (e, f) => {
    if (e[2] === f[2]) return false;
    const [H, V] = e[2] ? [e, f] : [f, e];
    const hr = isl[H[0]][0], hc1 = isl[H[0]][1], hc2 = isl[H[1]][1];
    const vc = isl[V[0]][1], vr1 = isl[V[0]][0], vr2 = isl[V[1]][0];
    return vc > Math.min(hc1, hc2) && vc < Math.max(hc1, hc2) && hr > Math.min(vr1, vr2) && hr < Math.max(vr1, vr2);
  };
  X = E.map(e => E.map(f => crosses(e, f)));
}
const edgeOf = (a, b) => E.findIndex(([x, y]) => (x === a && y === b) || (x === b && y === a));
const sums = () => { const s = isl.map(() => 0); E.forEach(([a, b], k) => { s[a] += val[k]; s[b] += val[k]; }); return s; };
function connected() {
  const adj = isl.map(() => []);
  E.forEach(([a, b], k) => { if (val[k]) { adj[a].push(b); adj[b].push(a); } });
  const seen = new Set([0]), st = [0];
  while (st.length) { const x = st.pop(); for (const y of adj[x]) if (!seen.has(y)) { seen.add(y); st.push(y); } }
  return seen.size === isl.length;
}

/* ---------- Render ---------- */
const board = $("#board");
const X0 = i => isl[i][1] * 10 + 5, Y0 = i => isl[i][0] * 10 + 5;
function render(hintEdge = -1, ghostTo = null) {
  const s = sums();
  let dots = "", br = "", is = "";
  for (let r = 0; r < P.h; r++) for (let c = 0; c < P.w; c++) dots += `<circle cx="${c * 10 + 5}" cy="${r * 10 + 5}" r=".5"/>`;

    if (!val[k]) return;
    const cls = k === hintEdge ? ' class="hint"' : "";
    const off = val[k] === 2 ? 1.1 : 0;
    for (const o of val[k] === 2 ? [-off, off] : [0]) {
      br += h ? `<line${cls} x1="${X0(a)}" y1="${Y0(a) + o}" x2="${X0(b)}" y2="${Y0(b) + o}"/>`
              : `<line${cls} x1="${X0(a) + o}" y1="${Y0(a)}" x2="${X0(b) + o}" y2="${Y0(b)}"/>`;
    }
  });
  const ghost = sel >= 0 && ghostTo ? `<line class="ghost" x1="${X0(sel)}" y1="${Y0(sel)}" x2="${ghostTo[0]}" y2="${ghostTo[1]}"/>` : "";
  isl.forEach(([r, c, n], i) => {
    const cls = i === sel ? "sel" : s[i] === n ? "full" : s[i] > n ? "over" : "";

  });

/* ---------- Etkileşim ---------- */
function toggle(a, b) {
  const k = edgeOf(a, b);
  if (k < 0) { toast("Bu iki ada arasında köprü kurulamaz"); return; }
  const next = (val[k] + 1) % 3;
  if (next && X[k].some((x, j) => x && val[j])) { toast("Köprüler birbirini kesemez"); return; }
  tickStart();
  history.push(val.slice());
  val[k] = next;
  save();
  check();
}
function svgPoint(e) {
  const svg = board.querySelector("svg"), r = svg.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * P.w * 10, (e.clientY - r.top) / r.height * P.h * 10];
}
function islandAt(e) {
  const [x, y] = svgPoint(e);
  let best = -1, bd = 6;   // dokunma alanı adadan biraz geniş
  isl.forEach((_, i) => { const d = Math.hypot(X0(i) - x, Y0(i) - y); if (d < bd) { bd = d; best = i; } });
  return best;
}
// sürüklemede yöne göre en yakın komşu adayı bul
function neighborToward(a, x, y) {
  const dx = x - X0(a), dy = y - Y0(a);
  if (Math.hypot(dx, dy) < 5) return -1;
  const horiz = Math.abs(dx) > Math.abs(dy);
  let best = -1, bd = Infinity;
  E.forEach(([p, q, h]) => {
    if (h !== horiz || (p !== a && q !== a)) return;
    const o = p === a ? q : p;
    const ox = X0(o) - X0(a), oy = Y0(o) - Y0(a);
    if ((horiz && Math.sign(ox) === Math.sign(dx)) || (!horiz && Math.sign(oy) === Math.sign(dy))) { const d = Math.abs(ox) + Math.abs(oy); if (d < bd) { bd = d; best = o; } }
  });
  return best;
}
let drag = null;
board.addEventListener("pointerdown", e => {

/* ---------- Süre ---------- */
const now = () => elapsed + (startedAt ? (Date.now() - startedAt) / 1000 : 0);

function tickStop() { if (startedAt) { elapsed += (Date.now() - startedAt) / 1000; startedAt = null; } }

/* ---------- Oyun ---------- */
function check() {
  const s = sums();
  if (isl.some((x, i) => s[i] !== x[2]) || !connected()) { render(); return; }
  tickStop(); won = true; sel = -1;
  save(); render();
  if (mode === "daily") {
    const st = stats[P.w]; st.played++;
    st.best = st.best === null ? Math.round(elapsed) : Math.min(st.best, Math.round(elapsed));

}
const LEVEL = { 7: "Kolay", 8: "Orta", 9: "Zor" };
function key() { return `kopru-${mode === "daily" ? "daily" : "practice"}-${size}`; }
function start(m, n = size, fresh = false) {
