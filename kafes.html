const { $, store, toast } = T;
T.kur({
  ad: "Kafes",
  modDegisti: m => start(m, size, true),
  yeni: () => start("practice", size, true), yeniEtiket: "Yeni bulmaca",
  yardim: `<p>Izgarayı 1'den boyuta kadar rakamlarla doldurun: her <b>satırda</b> ve <b>sütunda</b> her rakam bir kez.</p>
    <ul><li>Kalın çizgili her <b>kafesin</b> köşesinde bir hedef ve işlem var. Kafesteki rakamlar o işlemle hedefi vermeli.</li>
    <li><b>−</b> ve <b>÷</b> iki kareli kafeslerde büyükten küçüğe yapılır. Tek kareli kafes doğrudan rakamı verir.</li>
    <li>Kafes içinde aynı rakam tekrar edebilir (aynı satır ya da sütunda değilse).</li></ul>
    <div class="demo"><i><small>3÷</small>3</i><i><small>5+</small>2</i><i>1</i><i>3</i></div>
    <div class="hr"></div><p class="note">Her bulmacanın tek çözümü var. Dolu ama yanlış kafeslerin etiketi kırmızı olur.</p>`
});

let stats = store.get("kafes-stats", { 4: { played: 0, best: null }, 5: { played: 0, best: null }, 6: { played: 0, best: null }, streak: 0, best: 0, lastDay: null });
let size = store.get("kafes-size", 4);
let mode, day, pid, N, sol, cages, cageOf, vals, notes, sel, noteMode = false, history, elapsed, startedAt, hints, won;
const bySize = n => PUZZLES.map((p, i) => p.n === n ? i : -1).filter(i => i >= 0);

/* ---------- Kurallar ---------- */
function cageOk(cg, full = true) {
  const v = cg[2].map(i => vals[i]);
  if (v.some(x => !x)) return !full;
  const [op, t] = cg;
  if (op === "") return v[0] === t;
  if (op === "+") return v.reduce((a, b) => a + b) === t;
  if (op === "×") return v.reduce((a, b) => a * b) === t;
  const a = Math.max(...v), b = Math.min(...v);
  return op === "−" ? a - b === t : a === b * t;
}
function dupes() {
  const bad = new Set();
  for (let i = 0; i < N * N; i++) {
    if (!vals[i]) continue;
    const r = Math.floor(i / N), c = i % N;
    for (let k = 0; k < N; k++) {
      const a = r * N + k, b = k * N + c;
      if (a !== i && vals[a] === vals[i]) bad.add(i);
      if (b !== i && vals[b] === vals[i]) bad.add(i);
    }
  }
  return bad;
}

/* ---------- Render ---------- */
const grid = $("#grid");
function build() {
  grid.style.gridTemplateColumns = grid.style.gridTemplateRows = `repeat(${N},1fr)`;
  grid.style.setProperty("--n", N);
  grid.classList.remove("won");
  const thick = "var(--ink)";
  grid.innerHTML = Array.from({ length: N * N }, (_, i) => {
    const r = Math.floor(i / N), c = i % N, g = cageOf[i];
    // kafes sınırlarını kalın göster
    const sh = [];
    if (c < N - 1 && cageOf[i + 1] !== g) sh.push(`inset -2px 0 0 ${thick}`);
    if (c > 0 && cageOf[i - 1] !== g) sh.push(`inset 2px 0 0 ${thick}`);
    if (r < N - 1 && cageOf[i + N] !== g) sh.push(`inset 0 -2px 0 ${thick}`);
    if (r > 0 && cageOf[i - N] !== g) sh.push(`inset 0 2px 0 ${thick}`);
    const cg = cages[g];
    const label = Math.min(...cg[2]) === i ? `<span class="lb" data-g="${g}">${cg[1]}${cg[0]}</span>` : "";
    return `<div class="c" data-i="${i}" style="--d:${r + c};box-shadow:${sh.join(",") || "none"}">${label}<span class="v"></span></div>`;
  }).join("");
  $("#pad").style.gridTemplateColumns = `repeat(${N},1fr)`;
  $("#pad").innerHTML = Array.from({ length: N }, (_, k) => `<button data-v="${k + 1}">${k + 1}</button>`).join("");
}
function render(changed = -1) {
  const bad = dupes();
  const sr = sel >= 0 ? Math.floor(sel / N) : -1, sc = sel % N;
  grid.querySelectorAll(".c").forEach((el, i) => {
    const r = Math.floor(i / N), c = i % N;
    el.classList.toggle("sel", i === sel);
    el.classList.toggle("peer", sel >= 0 && i !== sel && (r === sr || c === sc));
    el.classList.toggle("same", sel >= 0 && vals[sel] && vals[i] === vals[sel] && i !== sel);
    el.classList.toggle("bad", bad.has(i));
    el.classList.toggle("in", i === changed);
    const v = el.querySelector(".v");
    const old = el.querySelector(".notes"); if (old) old.remove();
    v.textContent = vals[i] || "";
    if (!vals[i] && notes[i] && notes[i].length) el.insertAdjacentHTML("beforeend", `<div class="notes">${Array.from({ length: N }, (_, k) => `<i>${notes[i].includes(k + 1) ? k + 1 : ""}</i>`).join("")}</div>`);
  });
  grid.querySelectorAll(".lb").forEach(lb => { const cg = cages[+lb.dataset.g]; lb.classList.toggle("bad", cg[2].every(i => vals[i]) && !cageOk(cg)); });
  $("#noteBtn").classList.toggle("on", noteMode);
  $("#undoBtn").disabled = !history.length || won;
  ["#eraseBtn", "#noteBtn", "#hintBtn"].forEach(s => $(s).disabled = won);
  document.querySelectorAll("#sizes .chip").forEach(b => b.classList.toggle("on", +b.dataset.n === N));
}

/* ---------- Etkileşim ---------- */
const snap = () => history.push({ vals: vals.slice(), notes: notes.map(n => n.slice()) });
grid.addEventListener("click", e => { const el = e.target.closest(".c"); if (!el || won) return; sel = +el.dataset.i; tickStart(); render(); });
$("#pad").addEventListener("click", e => { const b = e.target.closest("button"); if (b) put(+b.dataset.v); });
function put(v) {
  if (won || sel < 0) return;
  tickStart(); snap();
  if (noteMode) { const n = notes[sel], k = n.indexOf(v); if (k >= 0) n.splice(k, 1); else n.push(v); vals[sel] = 0; }
  else { vals[sel] = vals[sel] === v ? 0 : v; notes[sel] = []; }
  save(); render(sel); check();
}
$("#eraseBtn").onclick = () => { if (sel < 0 || won) return; snap(); vals[sel] = 0; notes[sel] = []; save(); render(); };
$("#noteBtn").onclick = () => { noteMode = !noteMode; render(); };
$("#undoBtn").onclick = () => { const h = history.pop(); if (!h || won) return; vals = h.vals; notes = h.notes; save(); render(); };
$("#hintBtn").onclick = () => {
  if (won) return;
  tickStart();
  const i = sel >= 0 && vals[sel] !== sol[sel] ? sel : vals.findIndex((v, k) => v !== sol[k]);
  if (i < 0) return;
  snap(); vals[i] = sol[i]; notes[i] = []; sel = i; hints++; elapsed += 15;
  toast("İpucu: +15 saniye");
  save(); render(i); check();
};
document.addEventListener("keydown", e => {
  if (T.isOpen() || won) return;
  if (e.key >= "1" && e.key <= String(N)) put(+e.key);
  else if (e.key === "Backspace" || e.key === "Delete" || e.key === "0") $("#eraseBtn").click();
  else if (e.key === "n" || e.key === "N") $("#noteBtn").click();
  else if (e.key.startsWith("Arrow") && sel >= 0) {
    const r = Math.floor(sel / N), c = sel % N;
    const [dr, dc] = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    sel = ((r + dr + N) % N) * N + (c + dc + N) % N; e.preventDefault(); render();
  }
});
document.querySelectorAll("#sizes .chip").forEach(b => b.onclick = () => { if (+b.dataset.n !== N) start(mode, +b.dataset.n); });

/* ---------- Süre ---------- */
const now = () => elapsed + (startedAt ? (Date.now() - startedAt) / 1000 : 0);
function tickStart() { if (!won && !startedAt) startedAt = Date.now(); }
function tickStop() { if (startedAt) { elapsed += (Date.now() - startedAt) / 1000; startedAt = null; } }
setInterval(() => { $("#clock").textContent = T.fmt(now()); }, 250);
document.addEventListener("visibilitychange", () => { if (document.hidden) { tickStop(); save(); } });

/* ---------- Oyun ---------- */
function check() {
  if (vals.some(v => !v) || dupes().size || cages.some(cg => !cageOk(cg))) return;
  tickStop(); won = true; sel = -1;
  save(); render(); grid.classList.add("won");
  if (mode === "daily") {
    const st = stats[N]; st.played++;
    st.best = st.best === null ? Math.round(elapsed) : Math.min(st.best, Math.round(elapsed));
    T.seriGuncelle(stats, day, true);
    store.set("kafes-stats", stats);
  }
  toast(`Çözdünüz! ${T.fmt(elapsed)}`, 1900);
  setTimeout(() => { if (!T.isOpen()) T.open("stats"); }, 1400);
}
function key() { return `kafes-${mode === "daily" ? "daily" : "practice"}-${size}`; }
function start(m, n = size, fresh = false) {
  tickStop();
  mode = m; size = n; N = n; store.set("kafes-size", n);
  day = T.dayIndex();
  const list = bySize(n);
  let s = fresh && m === "practice" ? null : store.get(key(), null);
  if (s && m === "daily" && s.day !== day) s = null;
  if (!s) {
    pid = m === "daily" ? list[((day * 7 + 2) % list.length + list.length) % list.length] : T.shuffle(list.filter(i => i !== pid))[0];
    s = { pid, vals: Array(n * n).fill(0), notes: Array.from({ length: n * n }, () => []), elapsed: 0, hints: 0, won: false };
  }
  ({ pid, vals, notes, elapsed, hints, won } = s);
  const P = PUZZLES[pid];
  sol = [...P.s].map(Number); cages = P.k;
  cageOf = Array(N * N); cages.forEach((cg, g) => cg[2].forEach(i => cageOf[i] = g));
  sel = -1; history = []; startedAt = null; noteMode = false;
  save(); build(); render();
  if (won) grid.classList.add("won");
  T.altSatir(m, day, ["Yeni bulmaca", () => start("practice", size, true)], `${N}×${N}`);
  T.aktifMod(m);
}
function save() { store.set(key(), { day, pid, vals, notes, elapsed: now(), hints, won }); }

/* ---------- İstatistik ---------- */
T.istatistik(() => `${won ? `<div class="result"><div class="big">${T.fmt(elapsed)}</div><p>${N}×${N} kafesi çözdünüz${hints ? ` · ${hints} ipucu` : ""}</p></div><h3>Genel</h3>` : ""}
  ${T.sayilar([[stats[4].played + stats[5].played + stats[6].played, "Çözülen"], [stats[4].best === null ? "–" : T.fmt(stats[4].best), "En İyi 4×4"], [stats[6].best === null ? "–" : T.fmt(stats[6].best), "En İyi 6×6"], [T.seri(stats), "Seri"]])}
  ${T.altBolum({ gunluk: mode === "daily", bitti: won })}`);
T.paylasim(() => `Kafes #${day + 1} · ${N}×${N} · ${T.fmt(elapsed)}${hints ? ` (${hints} ipucu)` : " · ipuçsuz"} ✅`);
T.gunDegisince(() => { if (mode === "daily" && T.dayIndex() !== day) start("daily"); });

/* ---------- Boot ---------- */
start("daily", size);
T.ilkZiyaret("kafes-seen");
</script>
